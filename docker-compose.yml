services:

  # ─────────────────────────────────────────────
  #  SA-MP Server — berjalan di atas Linux
  # ─────────────────────────────────────────────
  samp:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tstudio
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Jakarta
    ports:
      - "7779:7779/udp"
      - "7779:7779/tcp"
    volumes:
      - samp_logs:/tstudio/logs
      - ./scriptfiles/:/tstudio/scriptfiles/
      - ./gamemodes:/tstudio/gamemodes
    networks:
      - tstudio_net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x samp03svr >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  samp_logs:
    driver: local

networks:
  tstudio_net:
    driver: bridge